[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "mtmaya-cli"
version = "0.1.0"
description = "CLI for scaffolding and installing mtmaya Maya modules."
authors = [{ name = "mtd3v", email = "accounts@michaeltrainor.com" }]
requires-python = ">=3.13"
dependencies = [
    "mtmaya",
    "jinja2>=3.1.0",
    "typer>=0.19.0",
]

[project.scripts]
mtm = "mtmaya_cli:app"

[tool.uv.sources]
mtmaya = { workspace = true }
