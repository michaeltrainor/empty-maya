site_name: mtmaya
site_description: Library and CLI for Autodesk Maya tools, focused on game development.

theme:
  name: material

watch:
  - packages

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/mtmaya/src
            - packages/mtmaya-cli/src
          options:
            docstring_style: google
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - API reference: reference.md
